# Список сервисов (контейнеров)
services:
  # Первый сервис: база данных
  db:
    container_name: note_db
    image: postgres:16          # готовый образ из Docker Hub
    environment:                # переменные окружения
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: note
    ports:
      - "5432:5432"             # хост:контейнер
    volumes:
      - pg_data_noteprog:/var/lib/postgresql  # сохраняем данные
      
    # Проверка здоровья (ждём, пока БД реально запустится)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s      # Проверять каждые 3 секунд
      timeout: 12s       # Таймаут проверки
      retries: 4        # Количество попыток

  test_db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"  # ← другой порт


  # Второй сервис: твоё приложение
  app:
    container_name: app_note
    build: .                    # собирать образ из текущей папки (Dockerfile)
    ports:
      - "8001:8001"
    depends_on:                 # ждём, пока db запустится
        db:
          condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:admin@note_db:5432/note
    env_file:
      - .env

  frontend:
    container_name: task_frontend
    image: nginx:alpine
    ports:
      - "8081:80" # второй порт не трогать
    volumes:
      - ./simple_frontend:/usr/share/nginx/html:ro
    depends_on:
      - app

# Тома (хранилища данных)
volumes:
  pg_data_noteprog: